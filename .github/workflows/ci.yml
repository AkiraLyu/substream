name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build -p substream --features sherpa --locked
  media:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git rust ffmpeg yt-dlp python
      - uses: actions/checkout@v4
      - run: cargo test -p substream --locked --test offline --test video -- --ignored
  browser:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: browser/extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run check
      - run: npm run build
      - run: npm test
  overlay:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - run: pacman -Syu --noconfirm --needed git cmake ninja clang qt6-base qt6-declarative qt6-websockets layer-shell-qt
      - uses: actions/checkout@v4
      - run: clang-format --dry-run --Werror apps/overlay/src/*.cpp apps/overlay/src/*.h apps/overlay/tests/*.cpp
      - run: /usr/lib/qt6/bin/qmllint apps/overlay/qml/Overlay.qml
      - run: cmake -S apps/overlay -B build/overlay -G Ninja -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build/overlay --parallel 2
      - run: ctest --test-dir build/overlay --output-on-failure
