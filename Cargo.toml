[workspace]
members = ["crates/core", "crates/protocol", "crates/backends", "apps/substream"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
substream-core = { path = "crates/core" }
substream-protocol = { path = "crates/protocol" }
substream-backends = { path = "crates/backends" }
anyhow = "1.0"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.27"
thiserror = "2.0"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }
toml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
lto = "thin"
codegen-units = 1

