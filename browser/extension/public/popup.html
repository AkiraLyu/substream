<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Substream</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <h1>Substream <span data-i18n="liveCaptions"></span></h1>
    <label for="token" data-i18n="pairingToken"></label>
    <input id="token" type="password" autocomplete="off" spellcheck="false" maxlength="64" />
    <p class="hint" data-i18n="tokenLifetime"></p>
    <div class="actions">
      <button id="start" data-i18n="startCaptions"></button>
      <button id="stop" data-i18n="stop" disabled></button>
    </div>
    <p id="status" role="status" aria-live="polite" data-i18n="disconnected"></p>
    <p id="caption" aria-live="polite"><span id="stable"></span><span id="partial"></span></p>
    <p class="hint" data-i18n="captureScope"></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
