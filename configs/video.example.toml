# 相对文件路径以本配置文件所在目录为准。
output_dir = "../output/videos"
model = "../models/ggml-small.bin"
language = "auto"
threads = 4
# 分别限制下载、音频转换和识别的等待秒数。
timeout_secs = 3600

# 支持 yt-dlp 的 BROWSER[+KEYRING][:PROFILE][::CONTAINER] 格式。
# 删除此项即可匿名下载；Cookie 不会发送给浏览器扩展。
cookies_from_browser = "firefox"

yt_dlp_bin = "yt-dlp"
ffmpeg_bin = "ffmpeg"
whisper_bin = "whisper-cli"
